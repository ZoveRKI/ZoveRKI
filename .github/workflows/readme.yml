name: Profile README

on:
  # 每小时刷新一次：贡献城市的天色要跟上所在地的时间（夜里、黎明、白天、黄昏），天气也在变。
  # 数据和画面都没变时不会提交，一天里的提交主要来自换时段、变天和新的贡献
  schedule:
    - cron: '17 * * * *'
  # 可以在 Actions 页面手动运行
  workflow_dispatch:
  # 改了生成器或配置时立即重新生成
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'profile.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'mise.toml'
      - '.github/workflows/readme.yml'

permissions:
  contents: write

# 同一时间只运行一个，避免两次运行的提交互相覆盖
concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  readme:
    name: Regenerate profile README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Action 固定到提交 SHA，作者移动版本标签也影响不到这里；升级时换成新版本的 SHA
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and pnpm
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      # 令牌只交给这一步。抓取脚本只用到自己的代码和 Node 自带的模块，所以放在安装依赖之前：
      # 拿到令牌时还没有运行过任何 npm 依赖；抓取代码要是引入了第三方包，这一步会直接报错
      - name: Fetch data
        run: node src/fetch.ts
        env:
          # Actions 自带的 token 就能读取公开数据。PROFILE_TOKEN 是可选的个人访问令牌（仓库 secret），
          # 用勾选 repo 和 read:user 的 classic 令牌时，活动概览会包含私有仓库的贡献，私有仓库的名字不会显示
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Render
        run: node src/render.ts

      - name: Commit changes
        shell: bash
        run: |
          git add README.md assets data
          if git diff --cached --quiet; then
            echo '主页没有变化，不需要提交。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile'
          # 运行期间 main 有了新提交时，把这次提交接到最新的 main 上；冲突时保留新生成的文件
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done
          exit 1
