<title>Tech stack: languages: Rust, Go, TypeScript, JavaScript, Python, Ruby; frontend: React, Vite; backend: axum, Gin, Rails; libraries: tokio, serde; db-tools: sqlx, pgx, goose; databases: PostgreSQL, MySQL, SQLite, Redis; cloud: AWS, GCP.</title>
