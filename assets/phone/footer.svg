<svg xmlns="http://www.w3.org/2000/svg" width="440" height="80" viewBox="0 0 440 80" role="img" aria-label="Connection to ZoveRKI closed. Refreshed 2026-10-30 by GitHub Actions.">
<title>Connection to ZoveRKI closed. Refreshed 2026-10-30 by GitHub Actions.</title>
<style>
@font-face{font-family:ZMono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZMono;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
svg{font-family:ZMono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:#d3dbe8;font-variant-ligatures:none}
.dim{fill:#8494aa}.faint{fill:#56647a}.ac{fill:#5aaeff}.ac2{fill:#b48cff}.ok{fill:#4fd69c}.hi{fill:#f4f7fd}
@keyframes zin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes zblink{50%{opacity:0}}
@keyframes zrise{from{transform:scaleY(0)}}
@keyframes zgrow{from{transform:scaleX(0)}}
.in{animation:zin .6s cubic-bezier(.2,.7,.2,1) both}
.cursor{animation:zblink 1.1s steps(1) infinite}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:zrise .8s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:zgrow .9s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="440" height="80"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5aaeff" stroke-opacity=".06"/></pattern>
</defs>
<path d="M8 -40V72M432 -40V72M8 72H432" fill="none" stroke="#5aaeff" stroke-width="3" opacity=".55" filter="url(#glow)"/>
<rect x="8" y="0" width="424" height="72" fill="#0a0f17"/>
<rect x="8" y="0" width="424" height="72" fill="url(#grid)"/>
<g class="in" style="animation-delay:0.10s"><text x="24" y="28" class="dim"><tspan class="ok" font-weight="700">$</tspan> exit</text></g>
<g class="in" style="animation-delay:0.40s"><text x="24" y="50" class="dim">connection to <tspan class="ac">ZoveRKI</tspan> closed. <tspan class="faint">// EOF</tspan></text></g>
<path d="M8 0V72M432 0V72M8 72H432" fill="none" stroke="#5aaeff" stroke-width="1.2"/>
<g fill="none" stroke="#5aaeff" stroke-width="2"><path d="M3 59V77H21"/><path d="M419 77H437V59"/></g>
