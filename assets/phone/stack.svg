<title>Tech stack: languages: Rust, Go, TypeScript, JavaScript, Python, Ruby; frontend: React, Vite; desktop: Electron, GPUI; backend: axum, Gin, Rails; libraries: tokio, serde; db-tools: sqlx, pgx, goose; databases: PostgreSQL, MySQL, SQLite, Redis; cloud: AWS, GCP.</title>
<style>
@font-face{font-family:ZMono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
