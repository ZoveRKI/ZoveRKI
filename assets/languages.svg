<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Languages by bytes of code in public and private repos: TypeScript 34.2%, Rust 13.1%, Ruby 9.5%, Go 9.2%, CSS 8.2%, Other 25.7%.">
<title>Languages by bytes of code in public and private repos: TypeScript 34.2%, Rust 13.1%, Ruby 9.5%, Go 9.2%, CSS 8.2%, Other 25.7%.</title>
<style>
@font-face{font-family:ZMono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZMono;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
svg{font-family:ZMono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;fill:#d3dbe8;font-variant-ligatures:none}
.dim{fill:#8494aa}.faint{fill:#56647a}.ac{fill:#5aaeff}.ac2{fill:#b48cff}.ok{fill:#4fd69c}.hi{fill:#f4f7fd}
@keyframes zin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes zblink{50%{opacity:0}}
@keyframes zrise{from{transform:scaleY(0)}}
@keyframes zgrow{from{transform:scaleX(0)}}
.in{animation:zin .6s cubic-bezier(.2,.7,.2,1) both}
.cursor{animation:zblink 1.1s steps(1) infinite}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:zrise .8s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:zgrow .9s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
